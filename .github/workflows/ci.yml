name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Security scan of the platform itself (bandit)
        run: bandit -q -r app -x app/llm/stub_assets -ll
      - name: Platform tests (incl. end-to-end workflow with stub LLM)
        run: pytest -q --junitxml=platform-junit.xml
      - name: Run the reference workflow end to end (CLI)
        run: python -m app.cli run --example --auto-approve --report workflow-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            platform-junit.xml
            workflow-report.json

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sdlc-copilot:ci .
      - run: docker run --rm -e LLM_PROVIDER=stub sdlc-copilot:ci python -m pytest -q
