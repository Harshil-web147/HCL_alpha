[project]
name = "forge-sdlc"
version = "0.1.0"
description = "Human-governed AI SDLC workbench"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["unit: focused unit tests", "integration: API integration tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
